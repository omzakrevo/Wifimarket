name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter (analyze, test, build web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Textes i18n à jour
        run: |
          python3 tool/build_strings.py
          git diff --exit-code lib/core/i18n/strings.g.dart

      - run: flutter analyze

      - run: flutter test

      - name: Build web
        run: bash tool/build_web.sh

  sql:
    name: Tests SQL (migrations, RLS, logique)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client

      # Le script démarre un Postgres jetable via « su postgres » : il doit tourner en root.
      - name: Tests SQL
        run: sudo bash supabase/tests/run-local.sh
