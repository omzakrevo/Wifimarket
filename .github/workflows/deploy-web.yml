name: Déploiement site web (LWS)

# Compile le site Flutter web puis l'envoie sur l'hébergement LWS par FTP sécurisé (FTPS).
# Secrets requis (voir docs/DEPLOIEMENT_AUTO.md) : FTP_HOST, FTP_USER, FTP_PASSWORD.
# Variables facultatives (Settings → Variables) : FTP_DIR (défaut /htdocs/), FTP_PROTOCOL (défaut ftps).
on:
  push:
    branches: [main, master]
    paths-ignore: ['supabase/**', 'docs/**', 'deploy/**', '*.md']
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  web:
    name: Compiler et publier le site
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets
        id: check
        env:
          HOST: ${{ secrets.FTP_HOST }}
          USER: ${{ secrets.FTP_USER }}
          PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "Secrets FTP_HOST / FTP_USER / FTP_PASSWORD absents : publication ignorée."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.ready == 'true'
        with:
          channel: stable
          cache: true

      - name: Compiler le site
        if: steps.check.outputs.ready == 'true'
        run: |
          flutter pub get
          bash tool/build_web.sh

      - name: Publier sur LWS
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: build/web/
          server-dir: ${{ vars.FTP_DIR || '/htdocs/' }}
