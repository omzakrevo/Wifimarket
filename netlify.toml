# WiFiMarket (Flutter web) — build statique, sans serveur.
[build]
  command = "bash tool/netlify_build.sh"
  publish = "build/web"

[build.environment]
  # Clé PUBLIQUE Supabase uniquement. Ne jamais mettre la clé service_role ici.
  SUPABASE_URL = "https://gsukmkijatkmiopwwieg.supabase.co"
  SITE_URL = "https://wifimarket.tech"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache"
